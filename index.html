<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teen Titans GO! - Baby Hands Crisis</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="game-wrapper">
    <!-- TITLE SCREEN -->
    <div id="title-screen" class="screen active">
      <div class="pixel-bg"></div>
      <div class="title-container">
        <div class="ttg-logo">TEEN TITANS GO!</div>
        <div class="subtitle">Baby Hands Crisis</div>
        <div class="titan-row">
          <div class="pixel-char robin-idle" title="Robin"></div>
          <div class="pixel-char beast-idle" title="Beast Boy"></div>
          <div class="pixel-char cyborg-idle" title="Cyborg"></div>
          <div class="pixel-char raven-idle" title="Raven"></div>
          <div class="pixel-char star-idle" title="Starfire"></div>
        </div>
        <button id="start-btn" class="pixel-btn" onclick="console.log('Inline button click fired!')">▶ START GAME</button>
        <div class="controls-hint">
          <span>ARROW KEYS / WASD to move</span>
          <span>SPACE to jump / interact</span>
          <span>Z to attack</span>
        </div>
      </div>
    </div>

    <!-- CUTSCENE SCREEN -->
    <div id="cutscene-screen" class="screen">
      <div id="cutscene-box">
        <div id="cutscene-portrait"></div>
        <div id="cutscene-name"></div>
        <div id="cutscene-text"></div>
        <button id="cutscene-next" class="pixel-btn small">NEXT ▶</button>
      </div>
      <div id="cutscene-bg"></div>
    </div>

    <!-- GAME CANVAS -->
    <div id="game-screen" class="screen">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
      <!-- MOBILE CONTROLS -->
      <div id="mobile-controls">
        <div class="dpad">
          <button id="btn-left" class="touch-btn">◀</button>
          <button id="btn-right" class="touch-btn">▶</button>
          <button id="btn-jump" class="touch-btn">▲</button>
        </div>
        <div class="action-pad">
          <button id="btn-attack" class="touch-btn">👊</button>
        </div>
      </div>
      <div id="hud">
        <div id="hud-left">
          <span id="hud-lives">❤️❤️❤️</span>
          <span id="hud-chapter"></span>
        </div>
        <div id="hud-center">
          <div id="timer-display" class="hidden">⏱ <span id="timer-val">60</span>s</div>
        </div>
        <div id="hud-right">
          <span id="hud-score">SCORE: 0</span>
        </div>
      </div>
      <div id="game-message" class="hidden"></div>
    </div>

    <!-- WIN SCREEN -->
    <div id="win-screen" class="screen">
      <div class="end-container">
        <div class="end-title">🏆 TITANS ASSEMBLE! 🏆</div>
        <div class="end-text">Jump City is saved!<br>Robin proved that baby hands can still save the day!</div>
        <div class="end-robin">👶🤜</div>
        <div id="final-score"></div>
        <button id="restart-btn" class="pixel-btn">▶ PLAY AGAIN</button>
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="screen">
      <div class="end-container go">
        <div class="end-title">💀 GAME OVER 💀</div>
        <div class="end-text">Brother Blood wins... this time.<br>Robin's baby hands weren't enough!</div>
        <div class="end-robin shake">👶</div>
        <button id="retry-btn" class="pixel-btn">↩ TRY AGAIN</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=6"></script>
</body>
</html>
